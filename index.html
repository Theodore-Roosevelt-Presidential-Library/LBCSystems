<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How the Library Works — Theodore Roosevelt Presidential Library</title>
<meta name="description" content="Explore the energy, water and carbon systems of the Theodore Roosevelt Presidential Library in Medora, North Dakota, in an interactive 3D model.">
<link rel="canonical" href="https://lbcsystems.labs.trlibrary.com/">
<meta property="og:title" content="How the Library Works — Energy, Water and Carbon">
<meta property="og:description" content="Geothermal wells, solar canopies, water cleaned and used again, and a roof of native prairie. Explore the Library’s systems in 3D.">
<meta property="og:image" content="https://lbcsystems.labs.trlibrary.com/assets/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#163728">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%2325282A'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Georgia,serif' font-size='44' font-weight='bold' fill='%23ffffff'%3ET.R.%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
<script type="importmap">
{ "imports": { "three": "./assets/vendor/three/three.module.min.js", "three/addons/": "./assets/vendor/three/addons/" } }
</script>
</head>
<body>
<header class="masthead">
  <a href="https://www.trlibrary.com/" aria-label="Theodore Roosevelt Presidential Library"><img src="assets/trpl-logo.svg" alt="Theodore Roosevelt Presidential Library"></a>
  <span class="title">How the Library Works</span>
  <a class="visit" href="https://www.trlibrary.com/visit">Plan a visit →</a>
</header>

<div class="app">
  <div id="viewer" class="viewer" aria-label="Interactive 3D model of the Library and its grounds">
    <nav id="tabs" class="tabs" role="tablist" aria-label="Systems"></nav>
    <button id="btn-fs" class="fsbtn" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="tools">
      <button id="btn-under" aria-pressed="false" title="Make the ground see-through">See through ground</button>
      <button id="btn-roof" aria-pressed="false" title="Hide the roof to see inside">Lift the roof</button>
      <button id="btn-reset" title="Return to the full view">Reset view</button>
    </div>
    <p class="hint">Drag to turn · Scroll or pinch to zoom · Tap a number</p>
    <div id="loading" class="loading"><span>Loading the Library…</span></div>
  </div>
  <aside id="panel" class="panel" aria-live="polite">
    <button class="panel-toggle" aria-label="Show or hide details"><span></span></button>
    <div class="panel-body"></div>
  </aside>
</div>

<noscript><p style="padding:20px">This interactive model needs JavaScript.</p></noscript>
<script type="module" src="assets/app.js"></script>
</body>
</html>
